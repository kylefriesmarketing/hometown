<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>HOMETOWN</title>
<style>
  :root {
    --ink: #17202a;
    --panel: rgba(20, 27, 36, 0.88);
    --panel-line: rgba(255, 255, 255, 0.12);
    --text: #e8edf3;
    --dim: #9aa7b6;
    --accent: #7fc4ff;
    --good: #86d19a;
    --warn: #e8c86a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #0d1218; color: var(--text);
    font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #app { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; outline: none; cursor: grab; }
  canvas.dragging { cursor: grabbing; }

  .panel {
    position: absolute; background: var(--panel); border: 1px solid var(--panel-line);
    border-radius: 10px; padding: 12px 14px; backdrop-filter: blur(10px);
    box-shadow: 0 8px 28px rgba(0,0,0,.38);
  }

  /* ── top-left: the place ─────────────────────────────────────── */
  #place { top: 14px; left: 14px; max-width: 340px; }
  #place h1 { margin: 0 0 2px; font-size: 17px; letter-spacing: .3px; font-weight: 650; }
  #place .sub { color: var(--dim); font-size: 12px; margin-bottom: 10px; }
  #place select {
    width: 100%; margin-bottom: 10px; padding: 6px 8px; border-radius: 6px;
    background: rgba(255,255,255,.07); color: var(--text);
    border: 1px solid var(--panel-line); font: inherit; font-size: 13px;
  }
  .stats { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: 12.5px; }
  .stats dt { color: var(--dim); }
  .stats dd { margin: 0; font-variant-numeric: tabular-nums; }

  /* ── bottom-left: what's under the cursor ────────────────────── */
  #probe { bottom: 14px; left: 14px; min-width: 250px; font-size: 12.5px; }
  #probe .title { font-weight: 600; margin-bottom: 4px; font-size: 14px; }
  #probe .empty { color: var(--dim); font-style: italic; }
  .tag {
    display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 11px;
    background: rgba(127,196,255,.16); color: var(--accent); margin-right: 5px;
    border: 1px solid rgba(127,196,255,.28);
  }
  .tag.guess { background: rgba(232,200,106,.14); color: var(--warn); border-color: rgba(232,200,106,.3); }

  /* ── top-right: view options ─────────────────────────────────── */
  #opts { top: 14px; right: 14px; font-size: 12.5px; }
  #opts label { display: block; cursor: pointer; user-select: none; padding: 2px 0; }
  #opts input { margin-right: 7px; vertical-align: -1px; }
  #opts .hint { color: var(--dim); font-size: 11px; margin-top: 8px; line-height: 1.5; }
  kbd {
    background: rgba(255,255,255,.1); border: 1px solid var(--panel-line);
    border-radius: 4px; padding: 0 4px; font: 11px ui-monospace, monospace;
  }

  /* ── attribution: required by ODbL, and simply correct ───────── */
  #attrib {
    position: absolute; bottom: 6px; right: 10px; font-size: 10.5px;
    color: rgba(255,255,255,.5); text-shadow: 0 1px 3px rgba(0,0,0,.7);
  }
  #attrib a { color: rgba(255,255,255,.72); }

  /* ── loading ─────────────────────────────────────────────────── */
  #boot {
    position: fixed; inset: 0; display: grid; place-items: center;
    background: #0d1218; z-index: 50; transition: opacity .45s ease;
  }
  #boot.gone { opacity: 0; pointer-events: none; }
  #boot .inner { text-align: center; }
  #boot h2 { margin: 0 0 6px; font-size: 22px; letter-spacing: 3px; font-weight: 300; }
  #boot p { margin: 0; color: var(--dim); font-size: 13px; }
  #boot .err { color: #ff9b9b; max-width: 460px; text-align: left; font: 12px ui-monospace, monospace; }
</style>
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>

  <div class="panel" id="place">
    <h1 id="place-name">—</h1>
    <div class="sub" id="place-sub"></div>
    <select id="world-pick"></select>
    <dl class="stats" id="place-stats"></dl>
  </div>

  <div class="panel" id="probe">
    <div class="title">Under the cursor</div>
    <div id="probe-body" class="empty">move the mouse over the map</div>
  </div>

  <div class="panel" id="opts">
    <label><input type="checkbox" id="opt-guessed"> Mark invented heights</label>
    <label><input type="checkbox" id="opt-shadows" checked> Shadows</label>
    <div class="hint">
      <kbd>drag</kbd> pan · <kbd>right-drag</kbd> orbit<br>
      <kbd>wheel</kbd> zoom · <kbd>WASD</kbd> move · <kbd>Q</kbd><kbd>E</kbd> turn
    </div>
  </div>

  <div id="attrib">
    map data © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors ·
    elevation: AWS Terrain Tiles
  </div>
</div>

<div id="boot"><div class="inner">
  <h2>HOMETOWN</h2>
  <p id="boot-msg">reading the map…</p>
</div></div>

<script type="module" src="./main.js"></script>
</body>
</html>
